name: Publish Foundry release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(jq -r '.version' system.json)"
          if [[ "$tag_version" != "$manifest_version" ]]; then
            echo "Tag version $tag_version does not match system.json version $manifest_version."
            exit 1
          fi
          summary_file="release-summaries/${GITHUB_REF_NAME}.md"
          if [[ ! -s "$summary_file" ]]; then
            echo "Missing human-readable release summary: $summary_file"
            exit 1
          fi

      - name: Build Foundry package
        shell: bash
        run: |
          mkdir -p dist/package
          rsync -a ./ dist/package/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.agents/' \
            --exclude '.codex/' \
            --exclude 'dist/' \
            --exclude 'node_modules/' \
            --exclude 'packs-src/' \
            --exclude 'release-summaries/' \
            --exclude 'scripts/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '*.pdf' \
            --exclude '*.avif' \
            --exclude '*.bmp' \
            --exclude '*.gif' \
            --exclude '*.ico' \
            --exclude '*.jpeg' \
            --exclude '*.jpg' \
            --exclude '*.png' \
            --exclude '*.svg' \
            --exclude '*.tif' \
            --exclude '*.tiff' \
            --exclude '*.webp'
          cp dist/package/system.json dist/system.json
          cd dist/package
          zip -r ../fvtt-yze-srd-toolkit.zip .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_summary="$(cat "release-summaries/${GITHUB_REF_NAME}.md")"
          release_preamble="${release_summary}

          <!-- yze-release-summary:end -->"
          gh release create "$GITHUB_REF_NAME" \
            dist/system.json \
            dist/fvtt-yze-srd-toolkit.zip \
            --generate-notes \
            --notes "$release_preamble" \
            --title "$GITHUB_REF_NAME"
